<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Videolesson Transcriber</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/app.css">
</head>

<body>
    <nav class="navbar app-nav">
        <div class="container app-nav-inner">
            <a class="navbar-brand" href="/"><span class="brand-mark">›_</span><span>Videolesson <strong>Transcriber</strong></span></a>
            <a class="nav-link" href="/transcriptions">Transcriptions <span class="nav-arrow">↗</span></a>
        </div>
    </nav>
    <main class="container app-shell">
        <div class="page-heading">
            <div>
                <p class="eyebrow">MEDIA LIBRARY</p>
                <h1>Video lessons</h1>
                <p class="page-description">Browse your lesson archive and queue videos for transcription.</p>
            </div>
            <button id="queue-button" class="btn btn-primary" type="button"><span>+</span> Queue selected</button>
        </div>
        <div id="message" class="alert d-none" role="alert"></div>
        <div class="panel">
            <div class="panel-header"><span class="panel-title">Input /</span><span class="panel-hint">select videos to process</span></div>
            <div class="panel-body">
                <div id="folder-tree" class="tree" aria-label="Video folder tree"></div>
            </div>
        </div>
        <section class="queue-section">
            <div class="section-heading"><h2>Queue status</h2><span class="live-dot">LIVE</span></div>
            <div id="jobs" class="list-group"></div>
        </section>
    </main>
    <script src="/static/scripts/app.js"></script>
</body>

</html>
