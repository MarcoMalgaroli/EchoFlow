<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Videolesson Transcriber</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/app.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container"><a class="navbar-brand" href="/">Videolesson Transcriber</a><a class="btn btn-outline-light" href="/transcriptions">Transcriptions</a></div>
    </nav>
    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Video lessons</h1>
            <button id="queue-button" class="btn btn-primary" type="button">Queue selected</button>
        </div>
        <div id="message" class="alert d-none" role="alert"></div>
        <div class="card">
            <div class="card-body">
                <div id="folder-tree" class="tree"></div>
            </div>
        </div>
        <section class="mt-4">
            <h2 class="h5">Queue status</h2>
            <div id="jobs" class="list-group"></div>
        </section>
    </main>
    <script src="/static/scripts/app.js"></script>
</body>

</html>
